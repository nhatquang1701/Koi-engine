name: Windows CTest

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 MSVC environment and build
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B out\ci-${{ matrix.configuration }} -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build out\ci-${{ matrix.configuration }} --config ${{ matrix.configuration }}
          if errorlevel 1 exit /b 1
          ctest --test-dir out\ci-${{ matrix.configuration }} -C ${{ matrix.configuration }} --output-on-failure
