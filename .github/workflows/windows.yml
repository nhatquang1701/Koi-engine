name: Windows CTest

on:
  push:
  pull_request:

# Separate jobs so a Debug, sanitizer, or differential failure cannot cancel
# the primary Release suite, and so each leg can upload its own diagnostics.
jobs:
  release-full:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/measurement/requirements.txt
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet -r tools/measurement/requirements.txt
      - name: Configure x64 MSVC environment, build, and test Release
        shell: cmd
        env:
          # Wall-clock-sensitive search cases get extra in-process attempts; a
          # shared runner is easily starved when the suite runs at -j 4.
          KOI_TEST_RETRIES: "3"
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build build/ci-release --config Release
          if errorlevel 1 exit /b 1
          ctest --test-dir build/ci-release -C Release -j 4 --repeat until-pass:2 --output-on-failure --output-junit build/ci-release/ctest-junit.xml
          if errorlevel 1 exit /b 1
      - name: Upload Release test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-test-diagnostics
          path: |
            build/ci-release/ctest-junit.xml
            build/ci-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  windows-flake:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Configure x64 MSVC environment and build Release
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build/ci-flake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build build/ci-flake --config Release
          if errorlevel 1 exit /b 1
      # Three explicit runs with one in-process attempt ensure the job exposes
      # timing-sensitive failures instead of allowing retries to hide them.
      - name: Repeat timing-sensitive search and process tests without retries
        shell: cmd
        env:
          KOI_TEST_RETRIES: "1"
        run: |
          set "STATUS=0"
          for /L %%A in (1,1,3) do call :run-flake-attempt %%A
          exit /b %STATUS%
          :run-flake-attempt
          set "ATTEMPT=%1"
          ctest --test-dir build/ci-flake -C Release -j 1 --timeout 900 -R "^(koi_search_tests_[1-4]of4|transposition_table_tests|uci_controller_tests|search_service_tests|time_manager_tests|koi_engine_process|koi_engine_variant_process|koi_engine_en_croissant_process|koi_engine_time_safety_process)$" --output-on-failure --output-junit "build/ci-flake/ctest-flake-%ATTEMPT%.xml" > "build/ci-flake/ctest-flake-%ATTEMPT%.log" 2>&1
          set "ATTEMPT_STATUS=%ERRORLEVEL%"
          type "build/ci-flake/ctest-flake-%ATTEMPT%.log"
          echo Flake attempt %ATTEMPT% exit=%ATTEMPT_STATUS%
          if not "%ATTEMPT_STATUS%"=="0" set "STATUS=1"
          exit /b 0
      - name: Upload Windows flake diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-flake-test-diagnostics
          path: |
            build/ci-flake/ctest-flake-*.log
            build/ci-flake/ctest-flake-*.xml
            build/ci-flake/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  debug-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/measurement/requirements.txt
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet -r tools/measurement/requirements.txt
      - name: Configure x64 MSVC environment, build, and smoke-test Debug
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build/ci-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build build/ci-debug --config Debug
          if errorlevel 1 exit /b 1
          ctest --test-dir build/ci-debug -C Debug -j 4 -LE heavy --repeat until-pass:2 --output-on-failure --output-junit build/ci-debug/ctest-junit.xml
          if errorlevel 1 exit /b 1
      - name: Upload Debug test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: debug-test-diagnostics
          path: |
            build/ci-debug/ctest-junit.xml
            build/ci-debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  sanitizer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Build and test with AddressSanitizer
        shell: cmd
        env:
          # ASan slows the engine down dramatically, so the wall-clock-sensitive
          # search and strength cases stay behind the heavy label; the few
          # timing-sensitive unit cases get one extra attempt.
          KOI_TEST_RETRIES: "2"
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build/ci-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=cl -DKOI_SANITIZE=ON
          if errorlevel 1 exit /b 1
          cmake --build build/ci-asan --config Debug
          if errorlevel 1 exit /b 1
          ctest --test-dir build/ci-asan -C Debug -j 2 -L unit -LE heavy --output-on-failure --output-junit build/ci-asan/ctest-junit.xml
          if errorlevel 1 exit /b 1
      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sanitizer-test-diagnostics
          path: |
            build/ci-asan/ctest-junit.xml
            build/ci-asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  shadow-diff:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build and run the native/shadow differential test
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DKOI_BUILD_SHADOW_DIFF=ON
          if errorlevel 1 exit /b 1
          cmake --build build/ci-release --config Release
          if errorlevel 1 exit /b 1
          ctest --test-dir build/ci-release -C Release -R koi_shadow_diff_tests --output-on-failure
          if errorlevel 1 exit /b 1
