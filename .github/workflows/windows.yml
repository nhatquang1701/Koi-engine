name: Windows CTest

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - configuration: Debug
            build_dir: build/ci-debug
          - configuration: Release
            build_dir: build/ci-release
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 MSVC environment and build
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build ${{ matrix.build_dir }} --config ${{ matrix.configuration }}
          if errorlevel 1 exit /b 1
          ctest --test-dir ${{ matrix.build_dir }} -C ${{ matrix.configuration }} --output-on-failure
          if errorlevel 1 exit /b 1
          rem The native/shadow differential target is opt-in, so CI reconfigures the
          rem same build directory with the switch enabled and runs just that test.
          cmake -S . -B ${{ matrix.build_dir }} -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_CXX_COMPILER=cl -DKOI_BUILD_SHADOW_DIFF=ON
          if errorlevel 1 exit /b 1
          cmake --build ${{ matrix.build_dir }} --config ${{ matrix.configuration }}
          if errorlevel 1 exit /b 1
          ctest --test-dir ${{ matrix.build_dir }} -C ${{ matrix.configuration }} -R koi_shadow_diff_tests --output-on-failure
          if errorlevel 1 exit /b 1
