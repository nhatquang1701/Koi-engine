name: Windows CTest

on:
  push:
  pull_request:

# Separate jobs so a Debug or differential failure cannot cancel the primary
# Release suite, and so each leg can upload its own diagnostics.
jobs:
  release-full:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/measurement/requirements.txt
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet -r tools/measurement/requirements.txt
      - name: Configure x64 MSVC environment, build, and test Release
        shell: cmd
        env:
          # Wall-clock-sensitive search cases get extra in-process attempts; a
          # shared runner is easily starved when the suite runs at -j 4.
          KOI_TEST_RETRIES: "3"
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build build/ci-release --config Release
          if errorlevel 1 exit /b 1
          ctest --test-dir build/ci-release -C Release -j 4 --repeat until-pass:2 --output-on-failure --output-junit build/ci-release/ctest-junit.xml
          if errorlevel 1 exit /b 1
      - name: Upload Release test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-test-diagnostics
          path: |
            build/ci-release/ctest-junit.xml
            build/ci-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  debug-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/measurement/requirements.txt
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet -r tools/measurement/requirements.txt
      - name: Configure x64 MSVC environment, build, and smoke-test Debug
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build/ci-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build build/ci-debug --config Debug
          if errorlevel 1 exit /b 1
          ctest --test-dir build/ci-debug -C Debug -j 4 -LE heavy --repeat until-pass:2 --output-on-failure --output-junit build/ci-debug/ctest-junit.xml
          if errorlevel 1 exit /b 1
      - name: Upload Debug test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: debug-test-diagnostics
          path: |
            build/ci-debug/ctest-junit.xml
            build/ci-debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  shadow-diff:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build and run the native/shadow differential test
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          set "VSDEVCMD=%VSINSTALL%\Common7\Tools\VsDevCmd.bat"
          if not exist "%VSDEVCMD%" exit /b 1
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          cl 2>&1 | findstr /C:"x64" >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl -DKOI_BUILD_SHADOW_DIFF=ON
          if errorlevel 1 exit /b 1
          cmake --build build/ci-release --config Release
          if errorlevel 1 exit /b 1
          ctest --test-dir build/ci-release -C Release -R koi_shadow_diff_tests --output-on-failure
          if errorlevel 1 exit /b 1
