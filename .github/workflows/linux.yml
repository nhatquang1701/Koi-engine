name: Linux CTest

on:
  push:
  pull_request:

# Separate jobs so a GCC, Clang, modules-off, or packaging failure cannot cancel
# the others, and so each leg can upload its own diagnostics.  The GCC/Clang
# legs exercise the C++26 named-module build; the modules-off leg proves the
# documented fallback (KOI_BUILD_MODULES=OFF) still builds and tests cleanly.
jobs:
  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/measurement/requirements.txt
      - name: Install the GCC 14 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build
          python -m pip install --disable-pip-version-check --quiet --upgrade cmake -r tools/measurement/requirements.txt
      - name: Configure and build with GCC 14
        run: |
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DKOI_TEST_TIMEOUT_SECONDS=300 \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build/ci-release --config Release -j 4
      # The CPU-flavor tests depend on what the host actually supports, and the
      # runner image changes over time, so record the flags and the AVX-512
      # binary's own verdict before the suite runs.
      - name: Show the host CPU features
        run: |
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^avx' | sort | tr '\n' ' '; echo
          set +e
          ./build/ci-release/koi-engine-avx512 </dev/null >/tmp/koi-avx512.out 2>/tmp/koi-avx512.err
          echo "koi-engine-avx512 exit=$?"
          cat /tmp/koi-avx512.out
          cat /tmp/koi-avx512.err
          set -e
      # The suite runs in four label-grouped steps so a slow or hanging group is
      # localized, the heavy search cases do not compete with the process tests,
      # and an interrupted step still leaves the earlier JUnit reports behind.
      # `--repeat until-pass:2` matches the Windows gate: wall-clock-sensitive
      # search and process cases are retried once on a starved shared runner.
      - name: Run the unit suite
        env:
          KOI_TEST_RETRIES: "3"
        run: |
          ctest --test-dir build/ci-release -C Release -j 4 -L unit -LE heavy \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-unit-junit.xml
      - name: Run the heavy search suite
        env:
          KOI_TEST_RETRIES: "5"
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -L heavy -LE process \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-heavy-junit.xml
      - name: Run the heavy process suite
        env:
          KOI_TEST_RETRIES: "3"
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 \
            -R "koi_engine_time_safety_process|koi_benchmark_process" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-heavy-process-junit.xml
      # Every process test gets its own step with a hard step timeout so a hung
      # test names itself in the job summary instead of stalling the whole job,
      # and the diagnostics upload below still runs.
      - name: Process suite - koi_replay_tests
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_replay_tests$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-1-junit.xml
      - name: Process suite - koi_engine_process
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_engine_process$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-2-junit.xml
      - name: Process suite - koi_engine_variant_process
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_engine_variant_process$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-3-junit.xml
      - name: Process suite - koi_engine_en_croissant_process
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_engine_en_croissant_process$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-4-junit.xml
      - name: Process suite - koi_uci_match_process
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_uci_match_process$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-5-junit.xml
      - name: Process suite - koi_stockfish_strength_option
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_stockfish_strength_option$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-6-junit.xml
      - name: Process suite - koi_uci_match_clock
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_uci_match_clock$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-7-junit.xml
      - name: Run the Python suite
        env:
          KOI_TEST_RETRIES: "3"
        # The Python suites are deterministic and finish in well under a minute
        # on Windows; a repeat here would only triple the cost of a hang, so the
        # step fails fast instead.  The output is redirected to a file so that a
        # leaked grandchild cannot hold the runner's stdout pipe open, and
        # `timeout` bounds the suite even when CTest cannot kill a stuck test.
        # The tests run serially so the log always ends at the test that failed.
        timeout-minutes: 15
        run: |
          set +e
          timeout 600 ctest --test-dir build/ci-release -C Release -j 1 -L python \
            --output-on-failure --output-junit build/ci-release/ctest-python-junit.xml \
            > /tmp/koi-python.log 2>&1
          status=$?
          set -e
          free -m || true
          sudo dmesg | tail -n 20 || true
          tail -n 250 /tmp/koi-python.log
          echo "python suite exit=${status}"
          exit "${status}"
      - name: Show the test log tail
        if: always()
        run: tail -n 150 build/ci-release/Testing/Temporary/LastTest.log || true
      - name: Upload GCC test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-gcc-test-diagnostics
          path: |
            build/ci-release/ctest-*-junit.xml
            build/ci-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  linux-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/measurement/requirements.txt
      - name: Install the Clang 18 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 clang-tools-18 libclang-rt-18-dev libc++-18-dev libc++abi-18-dev ninja-build
          python -m pip install --disable-pip-version-check --quiet --upgrade cmake -r tools/measurement/requirements.txt
      - name: Configure and build with Clang 18
        run: |
          # Clang 18 with libstdc++ cannot see <expected>: libstdc++ gates it on
          # __cpp_concepts >= 202002L, which Clang 17/18 report as 201907L.  This
          # leg therefore uses libc++ and skips the GCC-only static runtime flags.
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ \
            -DKOI_STATIC_RUNTIME=OFF -DKOI_TEST_TIMEOUT_SECONDS=300 \
            -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build/ci-release --config Release -j 4
      # Record the host's AVX flags and the AVX-512 binary's own verdict: the
      # gate must answer the host, not the flags the build was compiled with.
      - name: Show the host CPU features
        run: |
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^avx' | sort | tr '\n' ' '; echo
          set +e
          ./build/ci-release/koi-engine-avx512 </dev/null >/tmp/koi-avx512.out 2>/tmp/koi-avx512.err
          echo "koi-engine-avx512 exit=$?"
          cat /tmp/koi-avx512.out
          cat /tmp/koi-avx512.err
          set -e
      - name: Run the unit suite
        env:
          KOI_TEST_RETRIES: "3"
        run: |
          ctest --test-dir build/ci-release -C Release -j 4 -L unit -LE heavy \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-unit-junit.xml
      - name: Run the heavy search suite
        env:
          KOI_TEST_RETRIES: "5"
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -L heavy -LE process \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-heavy-junit.xml
      - name: Run the heavy process suite
        env:
          KOI_TEST_RETRIES: "3"
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 \
            -R "koi_engine_time_safety_process|koi_benchmark_process" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-heavy-process-junit.xml
      # Every process test gets its own step with a hard step timeout so a hung
      # test names itself in the job summary instead of stalling the whole job,
      # and the diagnostics upload below still runs.
      - name: Process suite - koi_replay_tests
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_replay_tests$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-1-junit.xml
      - name: Process suite - koi_engine_process
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_engine_process$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-2-junit.xml
      - name: Process suite - koi_engine_variant_process
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_engine_variant_process$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-3-junit.xml
      - name: Process suite - koi_engine_en_croissant_process
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_engine_en_croissant_process$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-4-junit.xml
      - name: Process suite - koi_uci_match_process
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_uci_match_process$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-5-junit.xml
      - name: Process suite - koi_stockfish_strength_option
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_stockfish_strength_option$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-6-junit.xml
      - name: Process suite - koi_uci_match_clock
        env:
          KOI_TEST_RETRIES: "3"
        timeout-minutes: 6
        run: |
          ctest --test-dir build/ci-release -C Release -j 1 -R "^koi_uci_match_clock$" \
            --repeat until-pass:2 \
            --output-on-failure --output-junit build/ci-release/ctest-process-7-junit.xml
      - name: Run the Python suite
        env:
          KOI_TEST_RETRIES: "3"
        # The Python suites are deterministic and finish in well under a minute
        # on Windows; a repeat here would only triple the cost of a hang, so the
        # step fails fast instead.  The output is redirected to a file so that a
        # leaked grandchild cannot hold the runner's stdout pipe open, and
        # `timeout` bounds the suite even when CTest cannot kill a stuck test.
        # The tests run serially so the log always ends at the test that failed.
        timeout-minutes: 15
        run: |
          set +e
          timeout 600 ctest --test-dir build/ci-release -C Release -j 1 -L python \
            --output-on-failure --output-junit build/ci-release/ctest-python-junit.xml \
            > /tmp/koi-python.log 2>&1
          status=$?
          set -e
          free -m || true
          sudo dmesg | tail -n 20 || true
          tail -n 250 /tmp/koi-python.log
          echo "python suite exit=${status}"
          exit "${status}"
      - name: Show the test log tail
        if: always()
        run: tail -n 150 build/ci-release/Testing/Temporary/LastTest.log || true
      - name: Upload Clang test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-clang-test-diagnostics
          path: |
            build/ci-release/ctest-*-junit.xml
            build/ci-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  linux-modules-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/measurement/requirements.txt
      - name: Install the GCC 14 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build
          python -m pip install --disable-pip-version-check --quiet --upgrade cmake -r tools/measurement/requirements.txt
      - name: Configure and build without C++26 modules
        run: |
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DKOI_BUILD_MODULES=OFF -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build/ci-release --config Release -j 4
      - name: Assert the module test is not registered, then run the unit suite
        env:
          KOI_TEST_RETRIES: "3"
        run: |
          if ctest --test-dir build/ci-release -N | grep -q koi_module_tests; then
            echo "koi_module_tests must not be registered when KOI_BUILD_MODULES=OFF" >&2
            exit 1
          fi
          ctest --test-dir build/ci-release -C Release -j 4 -L unit -LE heavy \
            --repeat until-pass:2 --output-on-failure
      - name: Upload modules-off test diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: linux-modules-off-test-diagnostics
          path: build/ci-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  linux-tarball:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The release tarball must run on older distributions, so it is built in
      # an Ubuntu 22.04 container (glibc 2.35 floor) with GCC 14 from the
      # toolchain PPA and a statically linked libstdc++/libgcc.
      - name: Build and package inside an Ubuntu 22.04 container
        run: |
          docker run --rm -v "$PWD":/work -w /work ubuntu:22.04 bash -euxo pipefail -c '
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gnupg wget software-properties-common python3-pip
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update
          apt-get install -y --no-install-recommends g++-14 powershell
          python3 -m pip install --disable-pip-version-check --quiet --upgrade cmake ninja
          cmake -S . -B build/ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DKOI_BUILD_MODULES=OFF -DKOI_ENABLE_GPU_NNUE=OFF
          cmake --build build/ci-release --config Release -j 4
          pwsh -NoProfile -File tools/build/package_release.ps1 -BuildDirectory build/ci-release -OutputDirectory artifacts/packages
          ls -l artifacts/packages
          # `stop` is required before `quit`: quitting an active search suppresses
          # its completion, so the transcript would never carry a bestmove.
          printf "uci\nisready\nposition startpos\ngo depth 2\nstop\nquit\n" | ./build/ci-release/koi-engine > /tmp/smoke-auto.txt 2> /tmp/smoke-auto.err
          cat /tmp/smoke-auto.txt
          cat /tmp/smoke-auto.err
          grep -q "bestmove" /tmp/smoke-auto.txt
          printf "uci\nisready\nposition startpos\ngo depth 2\nstop\nquit\n" | env KOI_CPU_VARIANT=generic ./build/ci-release/koi-engine > /tmp/smoke-generic.txt 2> /tmp/smoke-generic.err
          cat /tmp/smoke-generic.txt
          cat /tmp/smoke-generic.err
          grep -q "bestmove" /tmp/smoke-generic.txt
          tar -tzf artifacts/packages/koi-engine-v1.1-linux-x86_64.tar.gz
          '
      - name: Upload the portable tarball
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: koi-engine-linux-tarball
          path: artifacts/packages/koi-engine-v1.1-linux-x86_64.tar.gz
          if-no-files-found: ignore
          retention-days: 7
